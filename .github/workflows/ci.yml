name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-build:
    name: Typecheck & Build CLI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

  integration-test:
    name: Integration Test (Template Build)
    runs-on: ubuntu-latest
    needs: typecheck-and-build
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: latest

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Create test project via CLI
        run: node $GITHUB_WORKSPACE/dist/index.js test-app --pm pnpm
        working-directory: /tmp

      - name: Install dependencies in generated project
        working-directory: /tmp/test-app
        run: pnpm install

      - name: Build the generated template project
        working-directory: /tmp/test-app
        env:
          DATA_PROVIDER: rest
          AUTH_COOKIE_NAME: dashboard_session
          REST_API_BASE_URL: http://localhost:3001/api
          NEXT_PUBLIC_BASE_URL: https://example.com
          NEXT_PUBLIC_API_BASE_URL: http://localhost:3001/api
        run: pnpm run build
